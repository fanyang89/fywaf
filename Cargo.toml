[workspace]
members = [".", "crs-parser", "crs-engine"]
resolver = "2"

[package]
name = "fywaf"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.48", features = ["derive"] }
pingora = "0.7.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
tokio = "1.49.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
wasmtime = "29"

[profile.release.package.crs-engine]
opt-level = "z"
lto = true
