[package]
name = "fywaf"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.48", features = ["derive"] }
crc32fast = "1.4.2"
pingora = "0.7.0"
rkyv = { version = "0.8.11", features = ["std", "bytecheck"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9.34"
tokio = "1.49.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
