server:
  listen: "0.0.0.0:8080"

upstream:
  url: "http://127.0.0.1:9000"

waf:
  default_action: "allow"
  rules:
    - id: "block-admin-scan"
      enabled: true
      action: "block"
      status_code: 403
      methods: ["GET", "POST"]
      path_prefixes: ["/admin"]
      ip_cidrs: ["10.0.0.0/8"]
      user_agent_contains: ["sqlmap", "nmap"]
